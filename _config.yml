title: Jina Park | Backend Developer
description: "백엔드 개발자 박진아의 기술 블로그"
url: "https://jina9716.github.io"
baseurl: ""

lang: ko
timezone: Asia/Seoul

author:
  name: 박진아
  email: jina9716@gmail.com
  bio: "Backend Developer with 10+ years of experience"

permalink: /blog/:year/:month/:day/:title/

# GoatCounter 사이트 코드. 값을 채우면 방문 집계 스크립트가 붙는다
# 대시보드: https://<코드>.goatcounter.com
goatcounter: "jina9716"

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - scripts/
  - skills-lock.json

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
