<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <style>
    .src { fill: #f7f7f7; stroke: #b5b5b5; stroke-width: 1.2; }
    .harness { fill: #fbfbfb; stroke: #666; stroke-width: 1.3; }
    .inner { fill: #fff; stroke: #999; stroke-width: 1; }
    .mock { fill: #f7f7f7; stroke: #b5b5b5; stroke-width: 1; stroke-dasharray: 4 3; }
    .pass { fill: #eef7f0; stroke: #3a8a55; stroke-width: 1.4; }
    .na { fill: #f4f4f4; stroke: #999; stroke-width: 1.2; }
    .fail { fill: #fff; stroke: #999; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .defect { fill: #fdf1f0; stroke: #c1443f; stroke-width: 1.4; }
    .title { font-size: 14px; font-weight: 600; fill: #111; }
    .heading { font-size: 13px; font-weight: 600; fill: #111; }
    .label { font-size: 12px; fill: #222; }
    .small { font-size: 11px; fill: #555; }
    .muted { font-size: 11px; fill: #888; }
    .num { font-size: 22px; font-weight: 600; fill: #111; }
    .arrow { stroke: #666; stroke-width: 1.4; fill: none; }
    .arrow-red { stroke: #c1443f; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1443f"/>
    </marker>
  </defs>

  <!-- 입력 -->
  <rect x="30" y="60" width="180" height="110" rx="6" class="src"/>
  <text x="120" y="84" text-anchor="middle" class="heading">테스트 시트</text>
  <text x="120" y="106" text-anchor="middle" class="label">화면·앱 기준 80건</text>
  <text x="120" y="126" text-anchor="middle" class="small">Preconditions · Steps</text>
  <text x="120" y="142" text-anchor="middle" class="small">Expected Result</text>

  <rect x="30" y="230" width="180" height="110" rx="6" class="src"/>
  <text x="120" y="254" text-anchor="middle" class="heading">확장 점검</text>
  <text x="120" y="276" text-anchor="middle" class="label">시트 밖 조건</text>
  <text x="120" y="296" text-anchor="middle" class="small">포맷 조합 4가지 · 경계 시각</text>
  <text x="120" y="312" text-anchor="middle" class="small">출처 우선순위 · 자정 경계</text>

  <!-- 하네스 -->
  <rect x="280" y="40" width="360" height="320" rx="8" class="harness"/>
  <text x="460" y="66" text-anchor="middle" class="title">e2e 하네스 (HTTP 왕복)</text>

  <rect x="300" y="86" width="320" height="34" rx="4" class="inner"/>
  <text x="460" y="108" text-anchor="middle" class="label">실제 컨트롤러 + ValidationPipe</text>

  <rect x="300" y="130" width="320" height="34" rx="4" class="inner"/>
  <text x="460" y="152" text-anchor="middle" class="label">실제 use-case · 도메인 정규화 · 포맷 판정</text>

  <rect x="300" y="174" width="320" height="34" rx="4" class="inner"/>
  <text x="460" y="196" text-anchor="middle" class="label">실제 리포지토리 (MikroORM)</text>

  <rect x="300" y="218" width="320" height="34" rx="4" class="inner"/>
  <text x="460" y="240" text-anchor="middle" class="label">인메모리 MongoDB (단일 노드)</text>

  <rect x="300" y="268" width="150" height="34" rx="4" class="mock"/>
  <text x="375" y="290" text-anchor="middle" class="small">Redis · Kafka (no-op)</text>
  <rect x="470" y="268" width="150" height="34" rx="4" class="mock"/>
  <text x="545" y="290" text-anchor="middle" class="small">외부 API (no-op)</text>

  <text x="460" y="332" text-anchor="middle" class="muted">기준 시각 고정 · 요청 133건</text>

  <!-- 판정 -->
  <rect x="710" y="40" width="200" height="64" rx="6" class="pass"/>
  <text x="735" y="66" class="heading">Pass</text>
  <text x="890" y="72" text-anchor="end" class="num">40</text>
  <text x="735" y="90" class="small">API가 기대 결과를 만족</text>

  <rect x="710" y="116" width="200" height="64" rx="6" class="fail"/>
  <text x="735" y="142" class="heading">Fail</text>
  <text x="890" y="148" text-anchor="end" class="num">0</text>
  <text x="735" y="166" class="small">시트 케이스 안에서는 없음</text>

  <rect x="710" y="192" width="200" height="64" rx="6" class="na"/>
  <text x="735" y="218" class="heading">N/A</text>
  <text x="890" y="224" text-anchor="end" class="num">40</text>
  <text x="735" y="242" class="small">API 계층에서 판정 불가</text>

  <rect x="710" y="286" width="200" height="74" rx="6" class="defect"/>
  <text x="735" y="312" class="heading">서버 결함</text>
  <text x="890" y="318" text-anchor="end" class="num">3</text>
  <text x="735" y="334" class="small">저장 포맷 경계 2 · 필수값 오판 1</text>
  <text x="735" y="350" class="small">수정 후 재검증</text>

  <!-- 화살표 -->
  <path d="M210 115 L280 115" class="arrow" marker-end="url(#a)"/>
  <path d="M210 285 L280 285" class="arrow" marker-end="url(#a)"/>
  <path d="M640 120 L710 72" class="arrow" marker-end="url(#a)"/>
  <path d="M640 150 L710 148" class="arrow" marker-end="url(#a)"/>
  <path d="M640 180 L710 224" class="arrow" marker-end="url(#a)"/>
  <path d="M640 290 L710 323" class="arrow-red" marker-end="url(#a-red)"/>

  <text x="470" y="385" text-anchor="middle" class="muted">시트 케이스 판정과 시트 밖 확장 점검을 분리해 기록한다</text>
</svg>
