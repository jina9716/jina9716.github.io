<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>

  <!-- monolith -->
  <text x="185" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">모놀리스 — 단위가 전체</text>
  <rect x="60" y="70" width="250" height="270" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="185" y="98" text-anchor="middle" font-size="13" fill="#64748b">하나의 프로세스 · 하나의 배포 단위</text>

  <rect x="82" y="116" width="98" height="44" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="131" y="143" text-anchor="middle" font-size="12.5" fill="#334155">접수</text>
  <rect x="190" y="116" width="98" height="44" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="239" y="143" text-anchor="middle" font-size="12.5" fill="#334155">병원</text>
  <rect x="82" y="170" width="98" height="44" rx="7" fill="#fee2e2" stroke="#ef4444"/>
  <text x="131" y="192" text-anchor="middle" font-size="12.5" fill="#b91c1c">알림 (장애)</text>
  <text x="131" y="207" text-anchor="middle" font-size="10.5" fill="#b91c1c">메모리 누수</text>
  <rect x="190" y="170" width="98" height="44" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="239" y="197" text-anchor="middle" font-size="12.5" fill="#334155">결제</text>

  <path d="M 96 244 L 96 292 A 89 12 0 0 0 274 292 L 274 244" fill="#dbeafe" stroke="#3b82f6"/>
  <ellipse cx="185" cy="244" rx="89" ry="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="185" y="276" text-anchor="middle" font-size="12" fill="#1d4ed8">공유 DB</text>
  <text x="185" y="322" text-anchor="middle" font-size="11.5" fill="#64748b">모든 도메인이 한 저장소를 공유</text>

  <!-- limits -->
  <text x="620" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">규모가 커지면 청구되는 것</text>

  <rect x="380" y="70" width="480" height="60" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="400" y="95" font-size="14" font-weight="700" fill="#b45309">전체 재배포</text>
  <text x="400" y="117" font-size="12.5" fill="#475569">한 줄을 고쳐도 전체 재배포 — 회귀 테스트 범위가 항상 전체</text>

  <rect x="380" y="140" width="480" height="60" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="400" y="165" font-size="14" font-weight="700" fill="#b45309">부분 확장 불가</text>
  <text x="400" y="187" font-size="12.5" fill="#475569">접수만 몰려도 scale-out은 프로세스 전체 — 리소스 경합</text>

  <rect x="380" y="210" width="480" height="60" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="400" y="235" font-size="14" font-weight="700" fill="#b91c1c">장애 전파</text>
  <text x="400" y="257" font-size="12.5" fill="#475569">한 도메인의 누수·블로킹이 프로세스 전체를 내림</text>

  <rect x="380" y="280" width="480" height="60" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="400" y="305" font-size="14" font-weight="700" fill="#b45309">기술 스택 고착</text>
  <text x="400" y="327" font-size="12.5" fill="#475569">런타임 업그레이드를 전체가 한 번에 통과해야 해서 계속 미뤄짐</text>

  <line x1="316" y1="205" x2="374" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 374 200 L 384 205 L 374 210 z" fill="#94a3b8"/>

  <text x="440" y="378" text-anchor="middle" font-size="12.5" fill="#64748b">MSA는 배포·확장·장애·기술 선택의 단위를 서비스로 좁혀서 이 문제를 푼다 — 대신 분산 비용을 낸다</text>
</svg>
