<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="170" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">경계를 긋는 세 축</text>

  <rect x="20" y="70" width="300" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="102" font-size="15" font-weight="700" fill="#1d4ed8">Bounded Context</text>
  <text x="40" y="126" font-size="13" fill="#475569">공유 데이터가 아니라</text>
  <text x="40" y="144" font-size="13" fill="#475569">context가 제공하는 capability 기준</text>

  <rect x="20" y="178" width="300" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="210" font-size="15" font-weight="700" fill="#1d4ed8">데이터 접근 패턴</text>
  <text x="40" y="234" font-size="13" fill="#475569">함께 read/write되는 데이터 클러스터</text>
  <text x="40" y="252" font-size="13" fill="#475569">호출·쿼리 그래프로 식별</text>

  <rect x="20" y="286" width="300" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="318" font-size="15" font-weight="700" fill="#1d4ed8">팀 인지 용량</text>
  <text x="40" y="342" font-size="13" fill="#475569">Conway's Law — 팀 경계 = 서비스 경계</text>
  <text x="40" y="360" font-size="13" fill="#475569">크기 상한은 소유 팀의 인지 부하</text>

  <line x1="322" y1="114" x2="392" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="322" y1="222" x2="392" y2="222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="322" y1="330" x2="392" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="396" y="184" width="132" height="76" rx="12" fill="#2563eb"/>
  <text x="462" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">서비스 경계</text>
  <text x="462" y="240" text-anchor="middle" font-size="12" fill="#dbeafe">= 트랜잭션 경계</text>

  <text x="710" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">잘못 그어진 경계의 신호</text>

  <rect x="570" y="70" width="290" height="88" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="590" y="102" font-size="15" font-weight="700" fill="#b45309">coordinated deploy</text>
  <text x="590" y="126" font-size="13" fill="#475569">항상 같이 배포되는 서비스 쌍</text>
  <text x="590" y="144" font-size="13" fill="#475569">배포 이력의 상관관계로 탐지</text>

  <rect x="570" y="178" width="290" height="88" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="590" y="210" font-size="15" font-weight="700" fill="#b45309">cross-service join</text>
  <text x="590" y="234" font-size="13" fill="#475569">경계를 넘는 join·직접 조회</text>
  <text x="590" y="252" font-size="13" fill="#475569">shared DB가 남아 있다는 신호</text>

  <rect x="570" y="286" width="290" height="88" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="590" y="318" font-size="15" font-weight="700" fill="#b45309">chatty 왕복</text>
  <text x="590" y="342" font-size="13" fill="#475569">유스케이스 하나에 과다한 span fan-out</text>
  <text x="590" y="360" font-size="13" fill="#475569">tail latency가 straggler에 지배됨</text>

  <line x1="532" y1="204" x2="566" y2="114" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <line x1="532" y1="222" x2="566" y2="222" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <line x1="532" y1="240" x2="566" y2="330" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="462" y="290" text-anchor="middle" font-size="12" fill="#92400e">틀리면 이렇게 드러난다</text>
</svg>
