<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="440" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">동시성 경합을 푸는 순서 — 가벼운 도구부터</text>

  <!-- step 1 -->
  <rect x="40" y="80" width="240" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="60" y="112" font-size="14.5" font-weight="700" fill="#1d4ed8">① DB 유니크 제약</text>
  <text x="60" y="138" font-size="12.5" fill="#475569">중복 삽입을 DB 레벨에서 차단</text>
  <text x="60" y="158" font-size="12.5" fill="#475569">별도 코드 없이 스키마로 해결</text>

  <!-- step 2 -->
  <rect x="320" y="80" width="240" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="340" y="112" font-size="14.5" font-weight="700" fill="#1d4ed8">② 조건부 업데이트</text>
  <text x="340" y="138" font-size="12.5" fill="#475569">유효한 상태 전이만 반영</text>
  <text x="340" y="158" font-size="12.5" fill="#475569">PENDING→PAID 반영,</text>
  <text x="340" y="176" font-size="12.5" fill="#475569">PAID→PAID 무시</text>

  <!-- step 3 -->
  <rect x="600" y="80" width="240" height="120" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="620" y="112" font-size="14.5" font-weight="700" fill="#b45309">③ lock 직렬화</text>
  <text x="620" y="138" font-size="12.5" fill="#475569">경합 지점을 해당 단계 안에서</text>
  <text x="620" y="158" font-size="12.5" fill="#475569">직렬화 (row lock, 분산 락)</text>
  <text x="620" y="182" font-size="11.5" fill="#92400e">앞의 두 도구로 안 풀릴 때만</text>

  <line x1="284" y1="140" x2="314" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>
  <line x1="564" y1="140" x2="594" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrL)"/>
  <text x="299" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">안 되면</text>
  <text x="579" y="128" text-anchor="middle" font-size="10.5" fill="#64748b">안 되면</text>

  <!-- redlock caution -->
  <rect x="440" y="248" width="400" height="112" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="460" y="280" font-size="14" font-weight="700" fill="#b91c1c">분산 락(Redlock 등)의 비용</text>
  <text x="460" y="306" font-size="12.5" fill="#475569">만료 시간 · 경합 · 시계 오차까지 고려 대상</text>
  <text x="460" y="326" font-size="12.5" fill="#475569">락 획득 실패 시나리오를 설계하지 않으면</text>
  <text x="460" y="346" font-size="12.5" fill="#475569">락 자체가 또 다른 장애 지점</text>
  <line x1="720" y1="204" x2="720" y2="242" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrL)"/>

  <text x="60" y="290" font-size="12.5" fill="#64748b">경합이 도메인 규칙을 깨는 지점</text>
  <text x="60" y="310" font-size="12.5" fill="#64748b">(예약 정원, 계좌 잔액)은 이벤트 전파에</text>
  <text x="60" y="330" font-size="12.5" fill="#64748b">맡기지 않고 그 단계 안에서 직렬화</text>
</svg>
