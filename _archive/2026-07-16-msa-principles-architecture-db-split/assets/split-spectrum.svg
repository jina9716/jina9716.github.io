<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ① 접근 분리 -->
  <rect x="20" y="24" width="264" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="56" font-size="15" font-weight="700" fill="#334155">① 접근 분리</text>
  <rect x="160" y="38" width="110" height="24" rx="12" fill="#d1fae5"/>
  <text x="215" y="55" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">이번 전환에서 수행</text>

  <rect x="40" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="73" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 A</text>
  <rect x="119" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="152" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 B</text>
  <rect x="198" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="231" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 C</text>

  <line x1="73" y1="118" x2="73" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="152" y1="118" x2="152" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="231" y1="118" x2="231" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- single DB cylinder -->
  <path d="M 44 176 L 44 260 A 108 14 0 0 0 260 260 L 260 176" fill="#dbeafe" stroke="#3b82f6"/>
  <ellipse cx="152" cy="176" rx="108" ry="14" fill="#eff6ff" stroke="#3b82f6"/>
  <rect x="52" y="200" width="60" height="24" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="82" y="216" text-anchor="middle" font-size="11" fill="#1d4ed8">A 소유</text>
  <rect x="122" y="200" width="60" height="24" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="152" y="216" text-anchor="middle" font-size="11" fill="#1d4ed8">B 소유</text>
  <rect x="192" y="200" width="60" height="24" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="222" y="216" text-anchor="middle" font-size="11" fill="#1d4ed8">C 소유</text>
  <text x="152" y="250" text-anchor="middle" font-size="11.5" fill="#64748b">하나의 DB, 소유권만 확정</text>

  <text x="152" y="308" text-anchor="middle" font-size="12" fill="#475569">컬렉션마다 소유 도메인 확정</text>
  <text x="152" y="328" text-anchor="middle" font-size="12" fill="#475569">타 도메인 데이터는 API 경유</text>

  <line x1="288" y1="200" x2="314" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ② schema 분리 -->
  <rect x="318" y="24" width="264" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="338" y="56" font-size="15" font-weight="700" fill="#334155">② schema 분리</text>
  <rect x="458" y="38" width="110" height="24" rx="12" fill="#d1fae5"/>
  <text x="513" y="55" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">이번 전환에서 수행</text>

  <rect x="338" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="371" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 A</text>
  <rect x="417" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="450" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 B</text>
  <rect x="496" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="529" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 C</text>

  <line x1="371" y1="118" x2="371" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="450" y1="118" x2="450" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="529" y1="118" x2="529" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="332" y="170" width="236" height="112" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="450" y="272" text-anchor="middle" font-size="11.5" fill="#64748b">같은 클러스터</text>

  <path d="M 347 190 L 347 238 A 24 7 0 0 0 395 238 L 395 190" fill="#dbeafe" stroke="#3b82f6"/>
  <ellipse cx="371" cy="190" rx="24" ry="7" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="371" y="222" text-anchor="middle" font-size="11" fill="#1d4ed8">DB A</text>
  <path d="M 426 190 L 426 238 A 24 7 0 0 0 474 238 L 474 190" fill="#dbeafe" stroke="#3b82f6"/>
  <ellipse cx="450" cy="190" rx="24" ry="7" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#1d4ed8">DB B</text>
  <path d="M 505 190 L 505 238 A 24 7 0 0 0 553 238 L 553 190" fill="#dbeafe" stroke="#3b82f6"/>
  <ellipse cx="529" cy="190" rx="24" ry="7" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="529" y="222" text-anchor="middle" font-size="11" fill="#1d4ed8">DB C</text>

  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#475569">클러스터 안에서 DB 단위 분리</text>
  <text x="450" y="328" text-anchor="middle" font-size="12" fill="#475569">MongoShake로 무중단 이관</text>

  <line x1="586" y1="200" x2="612" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ③ 클러스터 분리 -->
  <rect x="616" y="24" width="264" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="636" y="56" font-size="15" font-weight="700" fill="#334155">③ 클러스터 분리</text>
  <rect x="762" y="38" width="104" height="24" rx="12" fill="#e2e8f0"/>
  <text x="814" y="55" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">다음 층위 · 미수행</text>

  <rect x="636" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="669" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 A</text>
  <rect x="794" y="86" width="66" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="827" y="106" text-anchor="middle" font-size="12" fill="#334155">서비스 B</text>

  <line x1="669" y1="118" x2="669" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="827" y1="118" x2="827" y2="164" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="630" y="170" width="112" height="112" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="686" y="272" text-anchor="middle" font-size="11.5" fill="#64748b">클러스터 1</text>
  <path d="M 662 190 L 662 238 A 24 7 0 0 0 710 238 L 710 190" fill="#dbeafe" stroke="#3b82f6"/>
  <ellipse cx="686" cy="190" rx="24" ry="7" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="686" y="222" text-anchor="middle" font-size="11" fill="#1d4ed8">DB A</text>

  <rect x="754" y="170" width="112" height="112" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="810" y="272" text-anchor="middle" font-size="11.5" fill="#64748b">클러스터 2</text>
  <path d="M 786 190 L 786 238 A 24 7 0 0 0 834 238 L 834 190" fill="#dbeafe" stroke="#3b82f6"/>
  <ellipse cx="810" cy="190" rx="24" ry="7" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="810" y="222" text-anchor="middle" font-size="11" fill="#1d4ed8">DB B</text>

  <text x="748" y="308" text-anchor="middle" font-size="12" fill="#475569">저장소 리소스 자체를 격리</text>
  <text x="748" y="328" text-anchor="middle" font-size="12" fill="#475569">부하 격리가 필요해질 때의 선택지</text>

  <text x="450" y="390" text-anchor="middle" font-size="12.5" fill="#64748b">소유권 → 권한·스키마 경계 → 리소스 격리 순으로, 층위마다 얻는 것이 다르다</text>
</svg>
